<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<!-- Background context (mocking a command center view) -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" data-alt="A dark, high-tech command center interface resembling an aerospace heads-up display. Neon blue and stark amber data points glow faintly against a deep black background with a subtle technical grid. The atmosphere is intense, focused, and precise, highlighting complex tactical telemetry modules." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDUcDHEc-mjqasbz14r5gq0P5BgkD31qNp97kulzu0Cbuy1YcEpBo1RYN9zbkN1VfMUFqgRDU5K42saOveWJTL2KFxnQ3OpehqdXT7ARysra-w-oNuRydckKWuenNPyMHftYBIX3oCe9OKc0ig9NdZYfbCJ6vm43CaovSzMtMU3ws4AQ9EwrznFDBashs2A5DSSNVBbf38DlphVlJcPRwvpLZ2O6Ye84gYYuRnmYiJ1l7INCHQ5kPM8')"></div>
<!-- Overlay backdrop -->
<div class="fixed inset-0 bg-surface-lowest/80 backdrop-blur-xl z-40 transition-opacity"></div>
<!-- Confirmation Dialog -->
<main class="relative z-50 w-full max-w-md bg-surface-charcoal border border-outline-variant shadow-[0_0_30px_rgba(0,0,0,0.8)] flex flex-col overflow-hidden">
<!-- Header / Scan Line -->
<div class="h-1 w-full scan-line"></div>
<div class="p-6 md:p-8 flex flex-col items-center text-center">
<!-- Icon -->
<div class="w-16 h-16 rounded-full border border-tertiary-container/30 bg-tertiary-container/10 flex items-center justify-center mb-6 glow-amber">
<span class="material-symbols-outlined text-tertiary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">
                    warning
                </span>
</div>
<!-- Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2 tracking-tight">
                CONFIRM_TERMINATION
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-4 max-w-sm">
                Are you sure you want to remove <span class="font-data-mono text-data-mono text-tertiary-container border-b border-tertiary-container/50">STARK_NODE_7X</span>?
            </p>
<div class="font-label-caps text-label-caps text-error bg-error/10 px-3 py-1.5 border border-error/20 mb-8 flex items-center gap-2">
<span class="material-symbols-outlined" style="font-size: 14px;">bolt</span>
                Action permanent
            </div>
<!-- Metadata footer inside dialog -->
<div class="w-full font-metadata text-metadata text-outline text-left mb-6 flex justify-between border-t border-outline-variant/50 pt-4">
<span>REQ_ID: 0x9A4B.F21</span>
<span>AUTH_LEVEL: OMEGA</span>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row w-full gap-4">
<button class="flex-1 font-label-caps text-label-caps text-primary border border-primary/50 hover:bg-primary/5 hover:border-primary transition-colors py-3 px-4 flex items-center justify-center gap-2 group focus:outline-none focus:ring-1 focus:ring-primary" type="button">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform" style="font-size: 16px;">close</span>
                    CANCEL
                </button>
<button class="flex-1 font-label-caps text-label-caps bg-tertiary-container text-on-tertiary-container hover:bg-tertiary transition-colors py-3 px-4 flex items-center justify-center gap-2 glow-amber active:scale-95 focus:outline-none focus:ring-2 focus:ring-tertiary-container" type="button">
                    PERMANENTLY_TERMINATE
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" style="font-size: 16px; font-variation-settings: 'FILL' 1;">delete_forever</span>
</button>
</div>
</div>
