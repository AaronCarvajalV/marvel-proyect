<style>
        body {
            background-color: #0a0a0c;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: center center;
        }

        .holographic-glow {
            box-shadow: 0 0 4px rgba(0, 210, 255, 0.4);
        }

        .input-glow:focus {
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.2);
        }

        @keyframes pulse-cyan {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot {
            animation: pulse-cyan 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>

<body class="min-h-screen flex items-center justify-center text-on-surface p-margin-mobile md:p-margin-desktop overflow-hidden">
<!-- Cinematic Centered Login Card -->
<div class="relative w-full max-w-md bg-surface-charcoal/80 backdrop-blur-xl border border-glass-border rounded flex flex-col items-center justify-center p-8 z-10 shadow-[0_1px_12px_rgba(0,210,255,0.1)]">
<!-- Subtle cyan lines for visual structure -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
<div class="absolute top-0 left-0 w-[1px] h-full bg-gradient-to-b from-transparent via-primary to-transparent opacity-50"></div>
<div class="absolute top-0 right-0 w-[1px] h-full bg-gradient-to-b from-transparent via-primary to-transparent opacity-50"></div>
<!-- System Scan Line in Header -->
<div class="absolute top-0 left-0 w-full h-1 bg-[linear-gradient(90deg,transparent_0%,rgba(0,210,255,0.2)_50%,transparent_100%)]"></div>
<!-- Logo / Branding -->
<div class="mb-8 flex flex-col items-center">
<span class="material-symbols-outlined text-6xl text-on-surface mb-2" style="font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48;">
                all_inclusive
            </span>
<h1 class="font-display-lg text-display-lg text-on-surface tracking-tight uppercase">Stark Ind.</h1>
<p class="font-metadata text-metadata text-primary mt-2 uppercase tracking-[0.2em]">JARVIS Subsystem Active</p>
</div>
<!-- Form Fields -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-1">
<label class="font-data-mono text-data-mono text-primary flex items-center gap-2" for="operator_id">
<span class="material-symbols-outlined text-sm">badge</span>
                    OPERATOR_ID
                </label>
<input class="w-full bg-background border border-[#121316] text-on-surface font-data-mono text-data-mono p-3 focus:outline-none focus:border-primary focus:ring-0 input-glow transition-all duration-300 rounded" id="operator_id" placeholder="ENTER ID SEQUENCE" type="text"/>
</div>
<div class="space-y-1">
<label class="font-data-mono text-data-mono text-primary flex items-center gap-2" for="passcode">
<span class="material-symbols-outlined text-sm">lock</span>
                    PASSCODE
                </label>
<input class="w-full bg-background border border-[#121316] text-on-surface font-data-mono text-data-mono p-3 focus:outline-none focus:border-primary focus:ring-0 input-glow transition-all duration-300 rounded" id="passcode" placeholder="••••••••••••" type="password"/>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary text-background font-label-caps text-label-caps py-4 rounded hover:holographic-glow transition-all duration-300 uppercase flex items-center justify-center gap-2 group mt-8" type="submit">
                INITIATE_PROTOCOL
                <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- System Status Footer -->
<div class="mt-8 flex items-center gap-2 border border-glass-border rounded bg-primary/10 px-4 py-2">
<div class="w-2 h-2 rounded-full bg-primary status-dot"></div>
<span class="font-metadata text-metadata text-primary uppercase">SECURE_CONNECTION_ESTABLISHED</span>
</div>
</div>
<!-- Background Atmospheric Glows -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed top-1/4 left-1/4 w-[300px] h-[300px] bg-primary/10 rounded-full blur-[80px] pointer-events-none -z-10"></div>
<div class="fixed bottom-1/4 right-1/4 w-[400px] h-[400px] bg-primary/5 rounded-full blur-[90px] pointer-events-none -z-10"></div>
